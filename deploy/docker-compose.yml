# Local infrastructure for running services from the IDE (dotnet run).
# Usage: docker compose -f deploy/docker-compose.yml up -d
name: kubeshop

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: kubeshop
      POSTGRES_PASSWORD: kubeshop
      POSTGRES_DB: kubeshop
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kubeshop"]
      interval: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:4-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: kubeshop
      RABBITMQ_DEFAULT_PASS: kubeshop
    ports:
      - "5672:5672"     # AMQP
      - "15672:15672"   # Management UI -> http://localhost:15672

volumes:
  postgres-data:
